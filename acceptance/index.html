<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HWatch Frontend 2.0 验收对比</title>
<style>body{margin:0;padding:24px;background:#11161e;color:#e8edf3;font:14px/1.6 system-ui}h1{font-size:24px}select,a{font:inherit;color:inherit}select{padding:8px;background:#202b38;border:1px solid #516070;border-radius:6px}.controls{display:flex;gap:16px;flex-wrap:wrap}.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}article{min-width:0}img{width:100%;border:1px solid #394858;border-radius:8px}p{color:#a5b4c4}@media(max-width:680px){body{padding:16px}.compare{grid-template-columns:1fr}}</style>
<h1>HWatch Frontend 2.0 · 浏览器验收</h1><p>使用相同合成数据截图，无真实媒体或部署凭据。旧版不支持亮色主题。完整交互结果请运行 npm run test:e2e。</p>
<div class="controls"><label>页面 <select id="page"><option value="dashboard">概览</option><option value="subscriptions">订阅</option><option value="downloads">下载</option><option value="library">影视库</option><option value="undownloaded">未下载</option><option value="excluded">已排除</option><option value="integrity">媒体完整性</option><option value="translations">翻译</option><option value="notifications">通知</option><option value="settings">设置</option></select></label><label>视口 <select id="width"><option>1280</option><option>390</option><option>768</option><option>1920</option></select></label><label>新版主题 <select id="theme"><option value="">暗色</option><option value="light-">亮色（390/1280）</option></select></label></div>
<div class="compare"><article><h2>旧版 · 3b06eab</h2><img id="before" alt="旧版页面截图"></article><article><h2>Frontend 2.0</h2><img id="after" alt="新版页面截图"></article></div>
<script>const page=document.querySelector('#page'),width=document.querySelector('#width'),theme=document.querySelector('#theme');function update(){let w=width.value;if(theme.value&&!['390','1280'].includes(w)){w='1280';width.value=w;}document.querySelector('#before').src=`before/${w}-${page.value}.png`;document.querySelector('#after').src=`after/${theme.value}${w}-${page.value}.png`;}[page,width,theme].forEach(e=>e.addEventListener('change',update));update();</script></html>
