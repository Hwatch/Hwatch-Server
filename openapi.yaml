openapi: 3.1.0
info:
  title: HWatch API
  version: 1.0.0
  description: NAS 媒体订阅、下载与 Plex 媒体库 API。时间均为 UTC RFC 3339。
servers:
  - url: /
security:
  - cookieAuth: []
tags:
  - name: Auth
  - name: Library
  - name: Downloads
  - name: Subscriptions
  - name: Settings
  - name: Translation
  - name: TransRunner
paths:
  /api/auth/status:
    get: {tags: [Auth], security: [], operationId: authStatus, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/auth/setup:
    post: {tags: [Auth], security: [], operationId: setupAdmin, requestBody: {$ref: '#/components/requestBodies/Credentials'}, responses: {'200': {$ref: '#/components/responses/JSON'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/auth/login:
    post: {tags: [Auth], security: [], operationId: login, requestBody: {$ref: '#/components/requestBodies/Credentials'}, responses: {'200': {$ref: '#/components/responses/JSON'}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}}
  /api/auth/logout:
    post: {tags: [Auth], operationId: logout, parameters: [{$ref: '#/components/parameters/CSRF'}], responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/auth/me:
    get: {tags: [Auth], operationId: authMe, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/dashboard:
    get: {tags: [Library], operationId: dashboard, parameters: [{$ref: '#/components/parameters/Language'}], responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/health:
    get:
      tags: [Settings]
      operationId: health
      responses:
        '200': {description: 服务健康状态；组件降级仍返回 200, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
  /api/notifications:
    get:
      tags: [Settings]
      operationId: listNotifications
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}]
      responses: {'200': {description: 持久系统通知, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPage'}}}}}
  /api/notifications/read-all:
    post:
      tags: [Settings]
      operationId: markNotificationsRead
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/JSON'}}
  /api/duplicates:
    get: {tags: [Library], operationId: listDuplicateCandidates, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/duplicates/{id}/{action}:
    post:
      tags: [Library]
      operationId: reviewDuplicateCandidate
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: action, in: path, required: true, schema: {type: string, enum: [confirm, dismiss]}}
        - {$ref: '#/components/parameters/CSRF'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, '400': {$ref: '#/components/responses/Error'}}
  /api/duplicates/batch:
    post:
      tags: [Library]
      operationId: reviewDuplicateCandidatesBatch
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [ids, action], properties: {ids: {type: array, maxItems: 500, items: {type: integer, format: int64}}, action: {type: string, enum: [confirm, dismiss]}}}}}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, '400': {$ref: '#/components/responses/Error'}}
  /api/exclusions/preview:
    post:
      tags: [Settings]
      operationId: previewExclusions
      description: 使用尚未保存的规则草稿预览命中项，不改变视频状态。
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {$ref: '#/components/requestBodies/JSONObject'}
      responses: {'200': {$ref: '#/components/responses/JSON'}}
  /api/audit:
    get:
      tags: [Settings]
      operationId: listAuditLogs
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: {'200': {$ref: '#/components/responses/JSON'}}
  /api/videos:
    get:
      tags: [Library]
      operationId: listVideos
      description: 媒体分页列表。管理员会话可用；持有 read_media scope 的 Service Token（integrationBearer）也可只读调用以枚举媒体，此时响应中的 file_path/plex_path 会被清空。
      security: [{cookieAuth: []}, {integrationBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: status, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: scope, in: query, schema: {type: string, enum: [all, original, translated]}}
        - {name: tags, in: query, schema: {type: string}}
        - {name: exclude_tags, in: query, schema: {type: string}}
        - {name: tag_mode, in: query, schema: {type: string, enum: [all, any]}}
        - {name: creator, in: query, schema: {type: string}}
        - {name: codec, in: query, schema: {type: string}}
        - {name: min_height, in: query, schema: {type: integer}}
        - {name: sort, in: query, schema: {type: string}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc]}}
        - {$ref: '#/components/parameters/Language'}
      responses: {'200': {$ref: '#/components/responses/VideoPage'}, '400': {$ref: '#/components/responses/Error'}}
  /api/videos/facets:
    get: {tags: [Library], operationId: videoFacets, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/tasks:
    get: {tags: [Downloads], operationId: listTasks, parameters: [{$ref: '#/components/parameters/TaskLimit'}, {$ref: '#/components/parameters/Offset'}, {name: status, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Language'}], responses: {'200': {$ref: '#/components/responses/VideoPage'}}}
  /api/tasks/{id}/history:
    get: {tags: [Downloads], operationId: taskHistory, parameters: [{$ref: '#/components/parameters/VideoID'}], responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/videos/download-all:
    post: {tags: [Downloads], operationId: downloadAll, parameters: [{$ref: '#/components/parameters/CSRF'}, {name: subscription, in: query, schema: {type: string}}], responses: {'202': {$ref: '#/components/responses/JSON'}}}
  /api/downloads/toggle:
    post: {tags: [Downloads], operationId: toggleDownloads, parameters: [{$ref: '#/components/parameters/CSRF'}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [paused], properties: {paused: {type: boolean}}}}}}, responses: {'202': {$ref: '#/components/responses/JSON'}}}
  /api/videos/{id}/{action}:
    post: {tags: [Downloads], operationId: videoAction, parameters: [{$ref: '#/components/parameters/VideoID'}, {name: action, in: path, required: true, schema: {type: string, enum: [download, retry, pause, resume, delete]}}, {$ref: '#/components/parameters/CSRF'}], responses: {'202': {$ref: '#/components/responses/JSON'}, '400': {$ref: '#/components/responses/Error'}}}
  /api/videos/{id}/delete:
    post:
      tags: [Library]
      operationId: deleteVideo
      description: 删除单个视频的媒体文件。媒体路径始终由服务端根据 video_id 从数据库解析并校验位于媒体根目录内；绝不接受客户端路径。
      parameters: [{$ref: '#/components/parameters/VideoID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {mode: {type: string, enum: [delete_only, delete_and_exclude], default: delete_only}}}}}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /api/videos/{id}/refresh-thumbnail:
    post:
      tags: [Library]
      operationId: refreshVideoThumbnail
      description: 重新抓取指定视频当前来源页面的封面，仅更新 thumbnail_url；不修改媒体文件、路径、编码、哈希、生命周期状态、排除或下载器状态。需要普通管理会话（CSRF），TransRunner Service Token 无权调用。返回 status（updated/unchanged/missing/failed）及 before/after。
      parameters: [{$ref: '#/components/parameters/VideoID'}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/JSON'}, '404': {$ref: '#/components/responses/Error'}}
  /api/media-exclusions:
    get:
      tags: [Library]
      operationId: listMediaExclusions
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}, {name: q, in: query, schema: {type: string}}, {name: source, in: query, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/JSON'}}
  /api/media-exclusions/{video_id}:
    delete:
      tags: [Library]
      operationId: removeMediaExclusion
      description: 删除指定 video_id 的排除 tombstone（恢复允许下载）；不会自动创建下载任务。
      parameters: [{name: video_id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/JSON'}}
  /api/media-integrity/scan:
    get:
      tags: [Library]
      operationId: mediaIntegrityScan
      description: 只读扫描已完成媒体的文件完整性；存储不可用时不会判定缺失。
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000000, default: 100000}}, {$ref: '#/components/parameters/CSRF'}]
      responses: {'200': {$ref: '#/components/responses/JSON'}}
  /api/media-integrity/import:
    post:
      tags: [Library]
      operationId: mediaIntegrityImport
      description: 自动识别删除清单格式并返回校验预览，不修改数据库。支持：外部已删除清单（数组或 {deletions:[...]}）、VDF GUI 原生导出（{CreatedAt,EstimatedTotalSavingsBytes,Groups:[{GroupId,RemoveItems,KeepItems}]}）。TransRunner 删除计划请使用模式二 /plan/*。
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, '422': {$ref: '#/components/responses/Error'}}
  /api/media-integrity/vdf/execute:
    post:
      tags: [Library]
      operationId: vdfGUIExecute
      description: 执行 VDF GUI 原生删除导出：按路径匹配 HWatch 媒体（服务端路径→两段后缀→唯一 basename），校验同订阅/保留项存在；删除文件仍在则移入隔离区，已被外部删除则仅写入排除（复用 RemoveAndExclude）。confirm=false 为 Dry Run；歧义或非受管路径拒绝执行。
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [raw, confirm], properties: {raw: {type: string}, confirm: {type: boolean}}}}}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, '422': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /api/media-integrity/apply:
    post:
      tags: [Library]
      operationId: mediaIntegrityApply
      description: 对已确认缺失且由删除清单匹配的媒体执行“移除记录并加入已排除”；confirm=false 为 Dry Run。每个视频独立事务，失败不影响其它条目。
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: {type: boolean, description: 必须为 true 才执行写入}
                raw: {type: string, description: 原始删除清单 JSON（可选，替代 deletions）}
                deletions: {type: array, items: {type: object, additionalProperties: true}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, '422': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /api/media-integrity/plan/preview:
    post:
      tags: [Library]
      operationId: transRunnerDeletionPlanPreview
      description: 解析并服务端重新校验 TransRunner 删除计划（kind=transrunner-duplicate-deletion-plan, plan_version=1），返回逐条校验结果；只读，不写库、不动文件。
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [raw], properties: {raw: {type: string}}}}}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, '422': {$ref: '#/components/responses/Error'}}
  /api/media-integrity/plan/execute:
    post:
      tags: [Library]
      operationId: transRunnerDeletionPlanExecute
      description: confirm=false 为 Dry Run；confirm=true 时对已验证条目把文件移入隔离区（同文件系统）并事务性写入排除，执行状态持久化，可重复执行与恢复。
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [raw, confirm], properties: {raw: {type: string}, confirm: {type: boolean}}}}}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, '422': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /api/media-integrity/plans:
    get: {tags: [Library], operationId: listDeletionPlans, parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}], responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/media-integrity/plan/{id}:
    get: {tags: [Library], operationId: getDeletionPlan, parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/JSON'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/media-integrity/plan/{id}/recover:
    post: {tags: [Library], operationId: recoverDeletionPlan, parameters: [{name: id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/CSRF'}], responses: {'200': {$ref: '#/components/responses/JSON'}, '503': {$ref: '#/components/responses/Error'}}}
  /api/subscriptions:
    get: {tags: [Subscriptions], operationId: listSubscriptions, responses: {'200': {$ref: '#/components/responses/JSON'}}}
    post: {tags: [Subscriptions], operationId: createSubscription, parameters: [{$ref: '#/components/parameters/CSRF'}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [url], properties: {url: {type: string, format: uri, description: 已注册适配器支持的订阅链接}, type: {type: string, enum: [creator, playlist], description: 可省略，由链接自动识别}, download_existing: {type: boolean, default: false}}}}}}, responses: {'201': {$ref: '#/components/responses/JSON'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '502': {$ref: '#/components/responses/Error'}}}
  /avatar/{slug}:
    get: {tags: [Subscriptions], operationId: subscriptionAvatar, parameters: [{$ref: '#/components/parameters/Slug'}], responses: {'200': {description: 本地缓存的订阅头像或 SVG 占位图, content: {image/jpeg: {}, image/png: {}, image/svg+xml: {}}}, '404': {$ref: '#/components/responses/Error'}}}
  /api/subscriptions/{slug}:
    patch: {tags: [Subscriptions], operationId: updateSubscription, parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}, additionalProperties: false}}}}, responses: {'200': {$ref: '#/components/responses/JSON'}}}
    delete: {tags: [Subscriptions], operationId: deleteSubscription, parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}], responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/platforms:
    get: {tags: [Subscriptions], operationId: listPlatforms, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/creators/search:
    get: {tags: [Subscriptions], operationId: searchCreators, parameters: [{name: platform, in: query, schema: {type: string}}, {name: q, in: query, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/check:
    post: {tags: [Subscriptions], operationId: checkAll, parameters: [{$ref: '#/components/parameters/CSRF'}], responses: {'202': {$ref: '#/components/responses/JSON'}}}
  /api/check/{slug}:
    post: {tags: [Subscriptions], operationId: checkSubscription, parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/CSRF'}], responses: {'202': {$ref: '#/components/responses/JSON'}}}
  /api/settings:
    get: {tags: [Settings], operationId: getSettings, responses: {'200': {$ref: '#/components/responses/JSON'}}}
    put: {tags: [Settings], operationId: updateSettings, parameters: [{$ref: '#/components/parameters/CSRF'}], requestBody: {$ref: '#/components/requestBodies/JSONObject'}, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/backups:
    get: {tags: [Settings], operationId: listBackups, responses: {'200': {$ref: '#/components/responses/JSON'}}}
    post: {tags: [Settings], operationId: createBackup, parameters: [{$ref: '#/components/parameters/CSRF'}], responses: {'201': {$ref: '#/components/responses/JSON'}}}
  /api/recovery/latest:
    get: {tags: [Settings], operationId: recoverySummary, responses: {'200': {description: 最近一次数据库恢复协调摘要, content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryStatus'}}}}}}
  /api/backups/{name}/restore:
    post: {tags: [Settings], operationId: restoreBackup, parameters: [{name: name, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/CSRF'}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [confirm], properties: {confirm: {type: boolean, description: 必须为 true}}}}}}, responses: {'202': {$ref: '#/components/responses/JSON'}, '422': {$ref: '#/components/responses/Error'}}}
  /api/translations/export:
    get: {tags: [Translation], operationId: exportTranslations, parameters: [{$ref: '#/components/parameters/Language'}, {name: platform, in: query, schema: {type: string}}, {name: subscription, in: query, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/translations/import:
    post: {tags: [Translation], operationId: importTranslations, parameters: [{$ref: '#/components/parameters/CSRF'}], requestBody: {$ref: '#/components/requestBodies/JSONObject'}, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/plex/refresh-nfo:
    post: {tags: [Translation], operationId: refreshNFO, parameters: [{$ref: '#/components/parameters/CSRF'}], requestBody: {content: {application/json: {schema: {type: object, properties: {language: {type: string, default: zh-CN}}, additionalProperties: false}}}}, responses: {'202': {$ref: '#/components/responses/JSON'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/import/html:
    post: {tags: [Library], operationId: importHTML, parameters: [{$ref: '#/components/parameters/CSRF'}], requestBody: {$ref: '#/components/requestBodies/JSONObject'}, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/events:
    get:
      tags: [Downloads]
      operationId: downloadEvents
      description: text/event-stream。客户端断线后自动重连，并通过 GET /api/dashboard 与 GET /api/tasks 恢复全量状态。
      responses:
        '200': {description: SSE 下载状态流, content: {text/event-stream: {schema: {type: string}}}}
  /api/integrations/transrunner/token:
    get: {tags: [TransRunner], operationId: getTransRunnerToken, responses: {'200': {$ref: '#/components/responses/JSON'}}}
    post: {tags: [TransRunner], operationId: createTransRunnerToken, parameters: [{$ref: '#/components/parameters/CSRF'}], requestBody: {content: {application/json: {schema: {type: object, properties: {rotate: {type: boolean, default: false}}}}}}, responses: {'201': {$ref: '#/components/responses/JSON'}, '409': {$ref: '#/components/responses/Error'}}}
    delete: {tags: [TransRunner], operationId: revokeTransRunnerToken, parameters: [{$ref: '#/components/parameters/CSRF'}], responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /api/transrunner/v1/media/{video_id}:
    get:
      tags: [TransRunner]
      security: [{integrationBearer: []}]
      operationId: transRunnerMedia
      description: 需要 read_media。只返回相对媒体路径与媒体元数据，不返回绝对路径或凭据。
      parameters: [{name: video_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 媒体元数据, content: {application/json: {schema: {$ref: '#/components/schemas/TransRunnerMedia'}}}}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /api/transrunner/v1/media/{video_id}/dedupe-candidates:
    get:
      tags: [TransRunner]
      security: [{integrationBearer: []}]
      operationId: transRunnerDedupeCandidates
      description: 需要 read_dedupe_candidates。候选由 HWatch 服务端筛选，调用方不扫描全库。
      parameters: [{name: video_id, in: path, required: true, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}]
      responses: {'200': {description: 去重候选, content: {application/json: {schema: {$ref: '#/components/schemas/TransRunnerDedupeCandidates'}}}}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /api/transrunner/v1/duplicate-results:
    post:
      tags: [TransRunner]
      security: [{integrationBearer: []}]
      operationId: transRunnerDuplicateResults
      description: 需要 write_duplicate_results。仅写入重复候选，绝不删除或替换媒体。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransRunnerDuplicateResult'}}}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /api/transrunner/v1/transcode-results:
    post:
      tags: [TransRunner]
      security: [{integrationBearer: []}]
      operationId: transRunnerTranscodeResults
      description: 需要 write_transcode_results。接收暂存产物并由 HWatch 自己 ffprobe 验证。默认只记录 pending 结果，不替换源文件；仅当 apply_mode=replace_source 且校验通过（HEVC、分辨率/帧率/时长/位深/色彩保持、source_sha256 一致）时才由 HWatch 原子替换源文件并刷新元数据。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransRunnerTranscodeResult'}}}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, '202': {$ref: '#/components/responses/JSON'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /api/transrunner/v1/transcode-results/{runner_job_id}:
    get:
      tags: [TransRunner]
      security: [{integrationBearer: []}]
      operationId: transRunnerTranscodeResultGet
      description: 需要 read_media。只读查询某 runner_job_id 是否已应用。返回 status（applied/not_applied/in_progress/uncertain/not_found）、applied、source_sha256、output_sha256、applied_at。not_found 不代表可以安全重复提交，尤其旧版任务需人工核查。
      parameters: [{name: runner_job_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/JSON'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /media/{id}:
    get: {tags: [Library], operationId: streamMedia, parameters: [{$ref: '#/components/parameters/VideoID'}], responses: {'200': {description: 支持 Range 的媒体流}}}
  /thumb/{id}:
    get: {tags: [Library], operationId: videoThumbnail, parameters: [{$ref: '#/components/parameters/VideoID'}], responses: {'200': {description: 图片或 SVG 占位图}}}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: hwatch_session}
    integrationBearer: {type: http, scheme: bearer, bearerFormat: opaque-service-token, description: 受限的 TransRunner 服务令牌，携带 scope。}
  parameters:
    CSRF: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
    VideoID: {name: id, in: path, required: true, schema: {type: string}}
    Slug: {name: slug, in: path, required: true, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 48}}
    TaskLimit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Language: {name: language, in: query, schema: {type: string, default: zh-CN}}
  requestBodies:
    Credentials: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Credentials'}}}}
    JSONObject: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
  responses:
    JSON: {description: 成功, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
    Error: {description: 请求失败, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    VideoPage: {description: 视频分页, content: {application/json: {schema: {$ref: '#/components/schemas/VideoPage'}}}}
  schemas:
    Error:
      type: object
      required: [code, error]
      properties: {code: {type: string}, error: {type: string}}
    Credentials:
      type: object
      required: [username, password]
      properties: {username: {type: string, minLength: 3, maxLength: 64}, password: {type: string, minLength: 10, maxLength: 256, writeOnly: true}}
    TransRunnerMedia:
      type: object
      required: [video_id, media_relative_path]
      properties:
        video_id: {type: string}
        media_relative_path: {type: string, description: 相对媒体根的路径，绝不返回绝对路径。}
        file_size: {type: integer, format: int64}
        duration: {type: integer, format: int64}
        container: {type: string}
        video_codec: {type: string}
        audio_codec: {type: string}
        width: {type: integer}
        height: {type: integer}
        fps: {type: number, format: double}
        bit_depth: {type: integer}
        bitrate: {type: integer, format: int64}
        sha256: {type: string}
    TransRunnerDedupeCandidate:
      type: object
      required: [video_id, media_relative_path]
      properties:
        video_id: {type: string}
        media_relative_path: {type: string}
        duration: {type: integer, format: int64}
        sha256: {type: string}
        file_size: {type: integer, format: int64}
    TransRunnerDedupeCandidates:
      type: object
      required: [video_id, algorithm_version, candidates]
      properties:
        video_id: {type: string}
        algorithm_version: {type: string, example: media-fingerprint-v1}
        candidates: {type: array, items: {$ref: '#/components/schemas/TransRunnerDedupeCandidate'}}
    TransRunnerDuplicateMatch:
      type: object
      required: [video_id, classification]
      properties:
        video_id: {type: string}
        classification: {type: string, enum: [whole-video, trimmed-video, possible-match, different]}
        backend: {type: string, example: phash}
        confidence: {type: number, minimum: 0, maximum: 1}
        metrics: {type: object, additionalProperties: true}
    TransRunnerDuplicateResult:
      type: object
      required: [video_id, matches]
      properties:
        video_id: {type: string}
        algorithm_version: {type: string, example: media-fingerprint-v1}
        matches: {type: array, items: {$ref: '#/components/schemas/TransRunnerDuplicateMatch'}}
    TransRunnerTranscodeResult:
      type: object
      required: [video_id, output_relative_path]
      properties:
        video_id: {type: string}
        runner_job_id: {type: string}
        source_sha256: {type: string, description: 提交源文件的 SHA-256；与当前不一致时返回 409 source_changed。}
        output_relative_path: {type: string, description: 必须位于暂存目录 .transrunner/ 内。}
        profile: {type: string, example: hevc-1080p}
        apply_mode: {type: string, enum: [replace_source], description: 省略时仅记录 pending；为 replace_source 时在校验通过后原子替换源文件。}
        idempotency_key: {type: string, description: 可选幂等键；也可用 Idempotency-Key 头。相同键但请求内容不同返回 409 idempotency_conflict；已成功应用的重复请求返回此前结果（idempotent=true），不会重复替换。}
    RecoveryStatus:
      type: object
      required: [available]
      properties:
        available: {type: boolean}
        summary:
          type: object
          properties:
            completed_at: {type: string, format: date-time}
            source_media_root: {type: string}
            current_media_root: {type: string}
            subscriptions: {type: integer}
            completed_media: {type: integer}
            missing_media: {type: integer}
            path_mismatches: {type: integer}
            paths_remapped: {type: integer}
            aria_tasks_checked: {type: integer}
            aria_tasks_kept: {type: integer}
            aria_tasks_requeued: {type: integer}
            aria_unavailable: {type: boolean}
            reconciliation_done: {type: boolean}
    Video:
      type: object
      required: [video_id, subscription_slug, title, status]
      properties:
        video_id: {type: string}
        subscription_slug: {type: string}
        platform: {type: string, description: 平台/适配器标识}
        title: {type: string}
        description: {type: string}
        translated_title: {type: string}
        views: {type: integer, format: int64}
        likes: {type: integer, format: int64}
        like_rate: {type: number, format: double, description: 点赞百分比，例如 99 表示 99%}
        tags: {type: array, items: {type: object, additionalProperties: true}}
        status: {type: string, enum: [discovered, queued, submitting, waiting, active, paused, failed, excluded, completed]}
        downloader_id: {type: string, description: 未分配时为空字符串，已分配时为 aria2 或 wget}
        external_task_id: {type: string}
        bytes_downloaded: {type: integer, format: int64}
        total_bytes: {type: integer, format: int64}
        download_speed: {type: integer, format: int64}
        connections: {type: integer}
        error: {type: string}
        error_code: {type: string, description: 稳定下载错误分类；无错误时为空字符串}
        error_retryable: {type: boolean}
      additionalProperties: true
    HealthWarning:
      type: object
      required: [code, severity, message]
      properties:
        code: {type: string, enum: [database_unavailable, storage_unavailable, storage_low, downloader_unavailable, download_failures]}
        severity: {type: string, enum: [warning, error]}
        message: {type: string}
    Health:
      type: object
      required: [status, warnings, database, storage, queue, downloaders, uptime_seconds]
      properties:
        status: {type: string, enum: [ok, degraded]}
        warnings: {type: array, items: {$ref: '#/components/schemas/HealthWarning'}}
        database: {type: object, additionalProperties: true}
        storage: {type: object, additionalProperties: true}
        queue: {type: object, additionalProperties: true}
        downloaders: {type: array, items: {type: object, additionalProperties: true}}
        uptime_seconds: {type: integer, format: int64}
    Notification:
      type: object
      required: [id, code, severity, message, created_at, read_at]
      properties:
        id: {type: integer, format: int64}
        code: {type: string, enum: [storage_unavailable, storage_low, consecutive_download_failures, downloader_unavailable]}
        severity: {type: string, enum: [warning, error]}
        message: {type: string}
        created_at: {type: string, format: date-time}
        read_at: {type: string, description: 未读时为空字符串}
    NotificationPage:
      type: object
      required: [items, unread]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Notification'}}
        unread: {type: integer, format: int64}
    VideoPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Video'}}
        total: {type: integer, format: int64}
        limit: {type: integer}
        offset: {type: integer}
        rate_limits:
          type: array
          description: 仅 /api/tasks 返回。按来源分别记录的 HTTP 429 退避状态。
          items: {$ref: '#/components/schemas/RateLimit'}
    RateLimit:
      type: object
      required: [source, backoff_until, waiting]
      properties:
        source: {type: string, description: 平台/适配器标识，例如 rule34video}
        host: {type: string, description: 触发限速的真实主机}
        reason: {type: string, enum: [rate_limit, network], description: rate_limit=HTTP 429；network=连续连接级失败（TLS/EOF/reset）触发的来源恢复退避}
        backoff_until: {type: string, format: date-time}
        retry_after_seconds: {type: integer, description: 服务端 Retry-After（若提供）}
        consecutive_429: {type: integer}
        transient: {type: integer, description: 连续连接级失败次数}
        waiting: {type: integer, description: 该来源当前等待中的 queued 任务数}
