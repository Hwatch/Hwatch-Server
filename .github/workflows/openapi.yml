name: OpenAPI contract
on:
  pull_request:
  push:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.x'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npx --yes @redocly/cli@1.34.5 lint openapi.yaml
      - run: npx --yes openapi-typescript@7.10.1 openapi.yaml -o /tmp/api.generated.ts
      - run: diff -u src/api.generated.ts /tmp/api.generated.ts
      - name: Verify generated Android Kotlin client
        run: |
          npx --yes @openapitools/openapi-generator-cli@2.18.4 generate -i openapi.yaml -g kotlin -o /tmp/android-kotlin --additional-properties=library=jvm-retrofit2,serializationLibrary=gson,packageName=app.hwatch.client
          diff -ru clients/android-kotlin/src /tmp/android-kotlin/src
          diff -ru clients/android-kotlin/docs /tmp/android-kotlin/docs
          diff -u clients/android-kotlin/build.gradle /tmp/android-kotlin/build.gradle
          diff -u clients/android-kotlin/settings.gradle /tmp/android-kotlin/settings.gradle
          chmod +x /tmp/android-kotlin/gradlew
          cd /tmp/android-kotlin && ./gradlew test
      - name: Detect breaking API changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git show "origin/${{ github.base_ref }}:openapi.yaml" > /tmp/openapi-base.yaml
          go run github.com/oasdiff/oasdiff@v1.11.7 breaking /tmp/openapi-base.yaml openapi.yaml --fail-on ERR
