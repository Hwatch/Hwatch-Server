name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: go test ./...
      - run: go vet ./...
      - name: Build static binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o dist/r34watch ./cmd/r34watch
      - name: Package
        run: |
          DIR="hwatch-${VERSION}-linux-${{ matrix.goarch }}"
          mkdir -p "$DIR/web"
          cp dist/r34watch "$DIR/"
          cp -r web/dist "$DIR/web/dist"
          cp openapi.yaml README.md LICENSE "$DIR/"
          cp deploy/hwatch.service "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"
          sha256sum "$DIR.tar.gz" > "$DIR.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.tar.gz.sha256
